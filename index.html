<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151c">
  <title>Clasificación de editores · Ranked Pro</title>
  <link rel="stylesheet" href="ranking.css">
  <script src="ranking.js" defer></script>
</head>
<body>
<header><div class="wrap mast"><div class="brand"><i aria-hidden="true"></i>RANKED <b>PRO</b></div><span>Clasificación pública</span></div></header>
<main class="wrap">
  <section class="hero">
    <div><h1>Ranking de<br><em>editores.</em></h1><p>Los 100 primeros por tiempo de edición en Premiere Pro.</p></div>
    <div class="timeline" aria-hidden="true"><div class="ruler"></div><div class="track"><i></i><i></i><i></i></div><div class="track second"><i></i><i></i></div><div class="track audio"></div><div class="playhead"></div></div>
  </section>
  <section class="board" aria-labelledby="board-title">
    <div class="tools"><div><h2 id="board-title">Clasificación general</h2><span id="updated"></span></div><button id="refresh" type="button"><span aria-hidden="true">↻</span> Actualizar</button></div>
    <table><thead><tr><th scope="col">Puesto</th><th scope="col">Editor</th><th scope="col">Tiempo de edición</th></tr></thead><tbody></tbody></table>
    <p id="status" role="status">Cargando clasificación…</p>
  </section>
</main>
</body></html>
